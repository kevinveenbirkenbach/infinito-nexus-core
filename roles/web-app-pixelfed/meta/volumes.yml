---
data:
  type: volume
  name: pixelfed_data
  mounts:
    - service: pixelfed
      target: &var_www_storage_target /var/www/html/storage
    - service: worker
      target: *var_www_storage_target

env:
  type: config
  source: "{{ lookup('container', 'web-app-pixelfed', 'files.env') }}"
  mode: "0444"
  mounts:
    - service: pixelfed
      target: &var_www_env_target /var/www/html/.env
    - service: worker
      target: *var_www_env_target

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: pixelfed
      target: /usr/local/etc/php/conf.d/zz-infinito-hardening.ini

rbac_oidc_login:
  type: config
  source: "{{ [lookup('container', 'web-app-pixelfed', 'directories.config'), 'InfinitoRbacOidcLogin.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: pixelfed
      target: /var/www/html/app/Listeners/InfinitoRbacOidcLogin.php
      when: "{{ lookup('config', 'web-app-pixelfed', 'services.sso.enabled') | bool }}"

rbac_userinfo_client:
  type: config
  source: "{{ [lookup('container', 'web-app-pixelfed', 'directories.config'), 'InfinitoRbacUserinfoClient.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: pixelfed
      target: /var/www/html/app/Services/InfinitoRbacUserinfoClient.php
      when: "{{ lookup('config', 'web-app-pixelfed', 'services.sso.enabled') | bool }}"
