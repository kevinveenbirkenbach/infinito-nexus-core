---
- name: "➕ PEERTUBE | Pre-provision the OIDC accounts of the role group members"
  include_tasks: 05_rbac/provision.yml
  when:
    - IS_STACK_HOST | bool
    - PEERTUBE_OIDC_ENABLED | bool

- name: "🛂 PEERTUBE | Converge the role of every OIDC account to its role groups"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: "{{ PEERTUBE_OIDC_ENABLED | bool }}"
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator, moderator]
    rbac_sync_service_key: postgres
    rbac_sync_service_name: "{{ lookup('database', application_id, 'service_name') }}"
    rbac_sync_container: "{{ lookup('database', application_id, 'container') }}"
    rbac_sync_kind: container
    rbac_sync_user: ""
    rbac_sync_argv:
      - psql
      - -U
      - "{{ lookup('database', application_id, 'username') }}"
      - -d
      - "{{ lookup('database', application_id, 'name') }}"
      - -v
      - ON_ERROR_STOP=1
      - -qtA
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/sql/rbac/reconcile-roles.sql') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      PGPASSWORD: "{{ lookup('database', application_id, 'password') }}"
      PEERTUBE_RBAC_ROLE_IDS: "{{ PEERTUBE_ROLE_IDS | to_json }}"
      PEERTUBE_OIDC_PLUGIN: "{{ PEERTUBE_OIDC_PLUGIN }}"
    rbac_sync_members_env:
      - { name: RBAC_MEMBERS, role: "*", field: "" }
