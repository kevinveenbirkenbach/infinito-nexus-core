---
- name: "🛂 Keep only the Magento admin accounts of the administrator group active"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: true
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator]
    rbac_sync_service_key: php
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ MAGENTO_PHP_CONTAINER }}"
    rbac_sync_kind: container
    rbac_sync_user: "{{ MAGENTO_USER }}"
    rbac_sync_argv: [php]
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/php/rbac/reconcile_admin_users.php') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      MAGENTO_RBAC_ROOT: "{{ MAGENTO_ROOT }}"
      MAGENTO_RBAC_PROTECTED: "{{ [MAGENTO_ADMIN_USERNAME] | to_json }}"
    rbac_sync_members_env:
      - { name: MAGENTO_RBAC_ADMINS, role: administrator, field: username }
