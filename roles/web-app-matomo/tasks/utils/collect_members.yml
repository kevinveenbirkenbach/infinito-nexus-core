---
# Param matomo_rbac_role: role of the application whose members join matomo_rbac_plan under its own name.

- name: "👥 Resolve the members of the {{ application_id }} role '{{ matomo_rbac_role }}'"
  ansible.builtin.include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: "{{ matomo_rbac_role }}"

- name: "👥 Add the members of '{{ matomo_rbac_role }}' to the RBAC plan"
  ansible.builtin.set_fact:
    matomo_rbac_plan: "{{ matomo_rbac_plan | combine({matomo_rbac_role: rbac_members}) }}"
