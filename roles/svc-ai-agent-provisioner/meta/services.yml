---
agent-provisioner:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  image: python
  # nocheck: docker-version  base of a self-built stdlib-only image, not the served application
  version: "3.13.15-slim"
  custom: true
  ca_client: true
  name: agent-provisioner
  min_storage: 130MB
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 256m
  pids_limit: 256
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
  request_timeout: 1800
  lease_ttl: 3600
  run_after:
    - svc-db-postgres
    - svc-db-openldap
  lifecycle: beta

postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag  server-side admin client of Keycloak with no browser SSO login or onion path, so a group_names gate would only defer the failure to runtime
sso:
  bond: 1
  enabled: true
  shared: true
  flavor: oidc

ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
