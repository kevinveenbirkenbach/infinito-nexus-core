---
system_service_id: sys-ctl-mtn-rbac-sync
RBAC_SYNC_HOOKS_DIR: "{{ [ DIR_RBAC_SYNC, 'hooks' ] | path_join }}"
RBAC_SYNC_SCRIPT_DIR: "{{ [ DIR_SCRIPTS_SYSTEMCTL, system_service_id ] | path_join }}"
RBAC_SYNC_LDAP_ENABLED: "{{ 'svc-db-openldap' in group_names }}"
RBAC_SYNC_LDAP_URI: "ldap://{{ DOCKER_REACH_HOST }}:{{ lookup('config', 'svc-db-openldap', 'services.openldap.ports.local.ldap') }}"
RBAC_SYNC_HOOK_TIMEOUT_SECONDS: 600
RBAC_SYNC_REFRESH_SECONDS: 86400
RBAC_SYNC_CONFIG:
  container_bin: "{{ BIN_CONTAINER }}"
  timeout_seconds: "{{ RBAC_SYNC_HOOK_TIMEOUT_SECONDS | int }}"
  refresh_seconds: "{{ RBAC_SYNC_REFRESH_SECONDS | int }}"
  ldap: >-
    {{
      {
        'uri': RBAC_SYNC_LDAP_URI,
        'users_dn': LDAP.DN.OU.USERS,
        'roles_dn': LDAP.DN.OU.ROLES,
        'attributes': {
          'id': LDAP.USER.ATTRIBUTES.ID,
          'mail': LDAP.USER.ATTRIBUTES.MAIL,
          'name': LDAP.USER.ATTRIBUTES.FULLNAME,
          'member_of': LDAP.USER.ATTRIBUTES.MEMBER_OF,
        },
      } if (RBAC_SYNC_LDAP_ENABLED | bool) else None
    }}
