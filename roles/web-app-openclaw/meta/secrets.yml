---
credentials:
  litellm_api_key:
    description: Per-consumer virtual key for the shared svc-ai-litellm gateway
    algorithm: sk_prefixed
    validation:
      min_length: 50
  sso_proxy_secret:
    description: Suffix of the header name the reverse proxy sends with every request; the gateway lists that header in trustedProxy.requiredHeaders, so a
      client that bypasses the proxy cannot name it
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  gateway_token:
    description: OpenClaw gateway token guarding the control UI and API, and the local CLI password while the OAuth2 proxy authenticates users
    algorithm: alphanumeric
    validation:
      min_length: 32
