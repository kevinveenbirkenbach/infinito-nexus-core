---
- name: "🛂 Grant realm-management roles to '{{ item.key }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} add-roles -r {{ KEYCLOAK_REALM | quote }}
    --gpath {{ ('/' ~ lookup('rbac_group_path', application_id=application_id, role=item.key)) | quote }}
    --cclientid {{ KEYCLOAK_CONSOLE_ROLE_CLIENT | quote }}
    {% for role_name in item.value %}--rolename {{ role_name | quote }} {% endfor %}
  loop: "{{ KEYCLOAK_CONSOLE_ROLE_GRANTS | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: kc_console_rbac
  retries: 5
  delay: 10
  until: kc_console_rbac.rc == 0
  changed_when: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
