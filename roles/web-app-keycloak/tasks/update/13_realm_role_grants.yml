---
- name: "🧩 Create realm role '{{ item.role }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} create roles -r {{ KEYCLOAK_REALM | quote }} -s name={{ item.role | quote }}
  loop: "{{ KEYCLOAK_REALM_ROLE_GRANTS }}"
  loop_control:
    label: "{{ item.role }}"
  register: kc_realm_role_create
  changed_when: kc_realm_role_create.rc == 0
  failed_when: kc_realm_role_create.rc != 0 and ('exists' not in (kc_realm_role_create.stderr | lower))

- name: "🛂 Grant realm role '{{ item.role }}' to its RBAC group"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} add-roles -r {{ KEYCLOAK_REALM | quote }}
    --gpath {{ item.group_path | quote }} --rolename {{ item.role | quote }}
  loop: "{{ KEYCLOAK_REALM_ROLE_GRANTS }}"
  loop_control:
    label: "{{ item.group_path }}"
  register: kc_realm_role_grant
  retries: 5
  delay: 10
  until: kc_realm_role_grant.rc == 0
  changed_when: true
