---
- name: "🛂 Converge accounts, admin flag, profiles and sessions of Semaphore"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: "{{ SEMAPHORE_OIDC_ENABLED | bool or SEMAPHORE_LDAP_ENABLED | bool }}"
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: "{{ SEMAPHORE_RBAC_LOGIN_ROLES }}"
    rbac_sync_service_key: postgres
    rbac_sync_service_name: "{{ lookup('database', application_id, 'service_name') }}"
    rbac_sync_container: "{{ lookup('database', application_id, 'container') }}"
    rbac_sync_kind: container
    rbac_sync_user: ""
    rbac_sync_argv:
      - psql
      - -U
      - "{{ lookup('database', application_id, 'username') }}"
      - -d
      - "{{ lookup('database', application_id, 'name') }}"
      - -v
      - ON_ERROR_STOP=1
      - -qtA
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/sql/rbac/reconcile.sql') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      PGPASSWORD: "{{ lookup('database', application_id, 'password') }}"
      SEMAPHORE_RBAC_KEPT: "{{ SEMAPHORE_RBAC_KEPT_ADMINISTRATORS | to_json }}"
    rbac_sync_members_env:
      - { name: RBAC_MEMBERS, role: "*", field: "" }
