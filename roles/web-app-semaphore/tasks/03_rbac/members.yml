---
# Param semaphore_rbac_role: login role whose members are collected into semaphore_rbac_members.
- name: "👥 Resolve the members of '{{ semaphore_rbac_role }}'"
  ansible.builtin.include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: "{{ semaphore_rbac_role }}"

- name: "👥 Collect the members of '{{ semaphore_rbac_role }}'"
  ansible.builtin.set_fact:
    semaphore_rbac_members: "{{ semaphore_rbac_members | combine({semaphore_rbac_role: rbac_members}) }}"
