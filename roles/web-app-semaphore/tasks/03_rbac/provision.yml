---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: semaphore
    resolve_output_prefix: SEMAPHORE
    resolve_compose_cid: "{{ SEMAPHORE_NAME }}"

- name: "👥 Resolve the administrator members"
  ansible.builtin.include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: administrator

- name: "⏳ List the Semaphore accounts once the API/DB is ready"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ SEMAPHORE_LOCAL_CID | quote }}
    semaphore user list
  register: semaphore_rbac_user_list
  changed_when: false
  retries: 30
  delay: 5
  until: semaphore_rbac_user_list.rc == 0
  delegate_to: "{{ SEMAPHORE_HOST_NODE }}"

- name: "➕ Create the missing administrator members as external Semaphore admins"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ SEMAPHORE_LOCAL_CID | quote }}
    semaphore user add
    --admin --external
    --login {{ item.username | quote }}
    --name {{ item.username | quote }}
    --email {{ item.email | quote }}
  loop: >-
    {{
      rbac_members
      | selectattr('email')
      | rejectattr('username', 'in', semaphore_rbac_user_list.stdout_lines)
      | list
    }}
  loop_control:
    label: "{{ item.username }}"
  register: semaphore_rbac_added
  changed_when: semaphore_rbac_added.rc == 0
  failed_when: >-
    semaphore_rbac_added.rc != 0
    and 'duplicate key' not in (semaphore_rbac_added.stderr | lower)
    and 'exist' not in (semaphore_rbac_added.stderr | lower)
    and 'exist' not in (semaphore_rbac_added.stdout | lower)
  delegate_to: "{{ SEMAPHORE_HOST_NODE }}"
