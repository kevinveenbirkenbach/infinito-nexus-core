---
- name: "⏳ Wait for MinIO IAM subsystem before policy attach"
  environment:
    MINIO_ROOT_USER: "{{ lookup('users', 'platform_administrator').username }}"
    MINIO_ROOT_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
  shell: |
    set -euo pipefail
    container run --rm \
        -e MINIO_ROOT_USER \
        -e MINIO_ROOT_PASSWORD \
        --entrypoint /bin/sh \
        {{ MINIO_MC_IMAGE }} \
        -c 'mc alias set minio {{ MINIO_API_URL | quote }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null \
            && mc admin policy ls minio'
  args: { executable: /bin/bash }
  register: mc_admin_policy_ls_ldap
  retries: 60
  delay: 5
  until: mc_admin_policy_ls_ldap.rc == 0
  changed_when: false

- name: "📁 Create the RBAC policies (LDAP variant)"
  environment:
    MINIO_ROOT_USER: "{{ lookup('users', 'platform_administrator').username }}"
    MINIO_ROOT_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
  shell: |
    set -euo pipefail
    printf '%s' '{{ (item.content | from_yaml | to_json) | b64encode }}' \
      | base64 -d \
      | container run --rm -i \
          -e MINIO_ROOT_USER \
          -e MINIO_ROOT_PASSWORD \
          --entrypoint /bin/sh \
          {{ MINIO_MC_IMAGE }} \
          -c 'mc alias set minio {{ MINIO_API_URL | quote }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null \
              && mc admin policy create minio {{ item.name | quote }} /dev/stdin || true'
  args: { executable: /bin/bash }
  loop: "{{ MINIO_RBAC_POLICIES }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: "🗂️ Attach each RBAC policy to its LDAP role group"
  environment:
    MINIO_ROOT_USER: "{{ lookup('users', 'platform_administrator').username }}"
    MINIO_ROOT_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
    MINIO_LDAP_GROUP_DN: "{{ item.group_dn }}"
  shell: |
    set -euo pipefail
    container run --rm \
        -e MINIO_ROOT_USER \
        -e MINIO_ROOT_PASSWORD \
        -e MINIO_LDAP_GROUP_DN \
        --entrypoint /bin/sh \
        {{ MINIO_MC_IMAGE }} \
        -c 'mc alias set minio {{ MINIO_API_URL | quote }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null \
            && mc admin policy attach minio {{ item.name | quote }} --group "$MINIO_LDAP_GROUP_DN"'
  args: { executable: /bin/bash }
  loop: "{{ MINIO_RBAC_POLICIES }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.group_dn }}"
  register: mc_policy_attach_ldap
  changed_when: '"already attached" not in mc_policy_attach_ldap.stderr'
  failed_when:
    - mc_policy_attach_ldap.rc != 0
    - '"already attached" not in (mc_policy_attach_ldap.stderr | default(""))'
