---
enabled: "{{ lookup('config', 'web-app-joomla', 'services.sso.enabled') | bool }}"
required: false
mechanism: plugin
source: built
# nocheck: unwatched-version  Reason: the plugin is built in this repository from files/joomla-oidc-plugin, so the version is ours and has no upstream
version: "1.2.0"
bridges:
  - sso
config:
  issuer_url: "{{ OIDC.CLIENT.ISSUER_URL }}"
  client_id: "{{ OIDC.CLIENT.ID }}"
  client_secret: "{{ OIDC.CLIENT.SECRET }}"
  redirect_uri: "{{ lookup('tls', 'web-app-joomla', 'url.base') }}/index.php?option=keycloak&task=callback"
  end_session_url: "{{ OIDC.CLIENT.LOGOUT_URL }}"
  fallback_enabled: "{{ lookup('config', 'web-app-joomla', 'services.sso.oidc.fallback_enabled') | string | lower }}"
  claims:
    username: "{{ OIDC.ATTRIBUTES.USERNAME }}"
    email: "{{ OIDC.ATTRIBUTES.EMAIL }}"
    given_name: "{{ OIDC.ATTRIBUTES.GIVEN_NAME }}"
    family_name: "{{ OIDC.ATTRIBUTES.FAMILY_NAME }}"
    locale: "{{ OIDC.ATTRIBUTES.LOCALE }}"
    zoneinfo: "{{ OIDC.ATTRIBUTES.ZONEINFO }}"
    address: "{{ OIDC.ATTRIBUTES.ADDRESS }}"
    groups: "{{ RBAC.GROUP.CLAIM }}"
  profile:
    claims:
      phone: "{{ OIDC.ATTRIBUTES.PHONE_NUMBER }}"
      website: "{{ OIDC.ATTRIBUTES.WEBSITE }}"
    address:
      address1: "{{ OIDC.ADDRESS_CLAIMS.STREET }}"
      city: "{{ OIDC.ADDRESS_CLAIMS.LOCALITY }}"
      region: "{{ OIDC.ADDRESS_CLAIMS.REGION }}"
      postal_code: "{{ OIDC.ADDRESS_CLAIMS.POSTAL_CODE }}"
      country: "{{ OIDC.ADDRESS_CLAIMS.COUNTRY }}"
  group_map: >-
    {{ {
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='administrator'): 8,
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='manager'): 6,
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='publisher'): 5,
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='editor'): 4,
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='author'): 3,
         '/' ~ lookup('rbac_group_path', application_id='web-app-joomla', role='registered'): 2,
       } }}
