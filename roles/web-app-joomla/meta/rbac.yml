---
roles:
  registered:
    description: Registered user in Joomla, maps onto the built-in `Registered` user group (id 2) that every signed-in user holds without a higher role.
  author:
    description: Author in Joomla, maps onto the built-in `Author` user group (id 3) and may create and edit own articles in the frontend.
  editor:
    description: Editor in Joomla, maps onto the built-in `Editor` user group (id 4) and may edit every article in the frontend.
  publisher:
    description: Publisher in Joomla, maps onto the built-in `Publisher` user group (id 5) and may publish and unpublish articles.
  manager:
    description: Manager in Joomla, maps onto the built-in `Manager` user group (id 6) and may sign in to the administrator backend to manage content.
