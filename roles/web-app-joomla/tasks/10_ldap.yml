---
- name: "🔐 Converge the core LDAP authentication plugin of {{ application_id }}"
  ansible.builtin.shell: >
    container exec -i
    --user {{ JOOMLA_WEB_USER | quote }}
    -e J_ROOT={{ JOOMLA_DOCROOT | quote }}
    -e J_LDAP_ENABLED={{ JOOMLA_LDAP_ENABLED | bool | ternary('1', '0') }}
    -e J_LDAP_PARAMS={{ (JOOMLA_LDAP_PARAMS if JOOMLA_LDAP_ENABLED | bool else {}) | to_json | quote }}
    -e J_LDAP_BIND_PASSWORD
    {{ JOOMLA_LOCAL_CID | quote }} php --
  args:
    stdin: "{{ lookup('file', role_path ~ '/files/php/ldap_plugin.php') }}"
  environment:
    J_LDAP_BIND_PASSWORD: "{{ LDAP.BIND_CREDENTIAL if JOOMLA_LDAP_ENABLED | bool else '' }}"
  register: joomla_ldap_plugin
  changed_when: (joomla_ldap_plugin.stdout | trim) == "changed"
  failed_when: joomla_ldap_plugin.rc != 0 or (joomla_ldap_plugin.stdout | trim) not in ['changed', 'ok']
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🧹 Clear the Joomla cache after an LDAP plugin change"
  ansible.builtin.shell: >
    container exec
    --user {{ JOOMLA_WEB_USER | quote }}
    {{ JOOMLA_LOCAL_CID | quote }}
    php {{ JOOMLA_CLI_FILE | quote }} cache:clean
  when: joomla_ldap_plugin is changed
  changed_when: true
