---
- name: "🚀 Deploy PHP error configuration (env aware)"
  stack_host_template:
    src: "php.ini.j2"
    dest: "{{ SUITECRM_PHP_CONFIG_HOST }}"
  notify:
    - compose-up

- name: "📄 Render SuiteCRM LDAP mapping"
  stack_host_template:
    src: "ldap.yaml.j2"
    dest: "{{ SUITECRM_LDAP_CONFIG_HOST }}"
  when: SUITECRM_LDAP_ENABLED | bool
  notify:
    - compose-up

- name: "📄 Deploy SuiteCRM session handler wiring"
  stack_host_copy:
    src: "session.yaml"
    dest: "{{ SUITECRM_SESSION_CONFIG_HOST }}"
    mode: "0444"
  notify:
    - compose-up

- name: "🛂 Deploy the SuiteCRM IAM extension classes"
  stack_host_copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0444"
  loop:
    - { src: "php/iam/saml_directory_sync.php", dest: "{{ SUITECRM_IAM_SAML_SYNC_HOST }}" }
    - { src: "php/iam/profile_ldap_user_provider.php", dest: "{{ SUITECRM_IAM_LDAP_PROVIDER_HOST }}" }
  loop_control:
    label: "{{ item.src }}"
  notify:
    - compose-up

- name: "🚀 Deploy '{{ SUITECRM_ENTRYPOINT_SCRIPT_HOST_ABS }}'"
  copy:
    src: "{{ SUITECRM_ENTRYPOINT_SCRIPT_SRC }}"
    dest: "{{ SUITECRM_ENTRYPOINT_SCRIPT_HOST_ABS }}"
  notify:
    - compose-up
    - compose-build

- name: "🚀 Deploy '{{ SUITECRM_EXTERNAL_AUTH_PATCH_HOST_ABS }}'"
  copy:
    src: "{{ SUITECRM_EXTERNAL_AUTH_PATCH_SRC }}"
    dest: "{{ SUITECRM_EXTERNAL_AUTH_PATCH_HOST_ABS }}"
  notify:
    - compose-up
    - compose-build

- name: "🐳 Docker Compose Up for '{{ application_id }}'"
  meta: flush_handlers

- name: "⏳ Wait until the SuiteCRM container is healthy"
  shell: >
    container inspect --type container --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ SUITECRM_CONTAINER_ADDRESS }}
  register: suitecrm_health
  changed_when: false
  until: suitecrm_health.stdout.strip() == "healthy"
  retries: 300
  delay: 5

- name: "🔑 Realign the SuiteCRM administrator password with the declared one"
  ansible.builtin.shell:
    cmd: >-
      container exec -i --user {{ SUITECRM_WEB_USER }}
      -e SUITECRM_REALIGN_USERNAME -e SUITECRM_REALIGN_PASSWORD
      {{ SUITECRM_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/realign_admin_password.php') }}"
  environment:
    SUITECRM_REALIGN_USERNAME: "{{ SUITECRM_ADMIN_USERNAME }}"
    SUITECRM_REALIGN_PASSWORD: "{{ SUITECRM_ADMIN_PASSWORD }}"
  register: suitecrm_admin_password_realign
  changed_when: suitecrm_admin_password_realign.stdout is search('\[CHANGED\]')
  failed_when: >-
    suitecrm_admin_password_realign.rc != 0
    or suitecrm_admin_password_realign.stdout is search('\[FAIL\]')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🛂 Reconcile the SuiteCRM admin flag with the administrator group"
  when: (SUITECRM_SSO_ENABLED | bool) or (SUITECRM_LDAP_ENABLED | bool)
  block:
    - name: "👥 Resolve the administrator group members of {{ application_id }}"
      ansible.builtin.include_tasks: utils/rbac/members.yml
      vars:
        rbac_members_application_id: "{{ application_id }}"
        rbac_members_role: administrator

    - name: "🛂 Make the SuiteCRM admin flag follow the administrator group"
      ansible.builtin.shell:
        cmd: >-
          container exec -i --user {{ SUITECRM_WEB_USER }}
          -e SUITECRM_RBAC_ADMINS -e SUITECRM_RBAC_PROTECTED
          {{ SUITECRM_CONTAINER_ADDRESS }} php
        stdin: "{{ lookup('file', 'php/reconcile_admins.php') }}"
      environment:
        SUITECRM_RBAC_ADMINS: "{{ rbac_members | map(attribute='username') | list | to_json }}"
        SUITECRM_RBAC_PROTECTED: "{{ [SUITECRM_ADMIN_USERNAME] | to_json }}"
      register: suitecrm_admin_reconcile
      changed_when: suitecrm_admin_reconcile.stdout is search('\[CHANGED\]')
      failed_when: >-
        suitecrm_admin_reconcile.rc != 0
        or suitecrm_admin_reconcile.stdout is search('\[FAIL\]')

- name: "🔎 List SuiteCRM log paths the web user cannot write"
  shell: >
    container exec --user {{ SUITECRM_WEB_USER }} {{ SUITECRM_CONTAINER_ADDRESS }}
    find {{ SUITECRM_APP_DIR }}/logs ! -writable
  register: suitecrm_unwritable_logs
  changed_when: false
  failed_when: suitecrm_unwritable_logs.rc != 0 or suitecrm_unwritable_logs.stdout | length > 0
