---
data:
  type: volume
  name: suitecrm_data
  mounts:
    - service: suitecrm
      target: /var/www/html/

php_config:
  type: config
  source: "{{ [lookup('container', 'web-app-suitecrm', 'directories.config'), 'php.ini'] | path_join }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: "/usr/local/etc/php/conf.d/{{ SOFTWARE_DOMAIN | replace('.', '-') }}.ini"

session_config:
  type: config
  source: "{{ [lookup('container', 'web-app-suitecrm', 'directories.config'), 'session.yaml'] | path_join }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: "{{ ['/var/www/html/extensions', SOFTWARE_DOMAIN | replace('.', '-'), 'config/packages/session.yaml'] | path_join }}"

ldap_config:
  type: config
  source: "{{ [lookup('container', 'web-app-suitecrm', 'directories.config'), 'ldap.yaml'] | path_join }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: "{{ ['/var/www/html/extensions', SOFTWARE_DOMAIN | replace('.', '-'), 'config/services/ldap/ldap.yaml'] | path_join }}"
      when: "{{ lookup('config', 'web-app-suitecrm', 'services.ldap.enabled') | bool }}"
iam_saml_directory_sync:
  type: config
  source: "{{ [lookup('container', 'web-app-suitecrm', 'directories.config'), 'SamlDirectorySync.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: /var/www/html/extensions/Iam/backend/Security/SamlDirectorySync.php

iam_profile_ldap_user_provider:
  type: config
  source: "{{ [lookup('container', 'web-app-suitecrm', 'directories.config'), 'ProfileLdapUserProvider.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: /var/www/html/extensions/Iam/backend/Security/ProfileLdapUserProvider.php

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: suitecrm
      target: /usr/local/etc/php/conf.d/zz-infinito-hardening.ini
