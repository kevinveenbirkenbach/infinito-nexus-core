---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: sys-stk-full

- name: "🎬 Stage the LAM entrypoint and its PHP helper into the compose build context"
  stack_host_copy:
    src: "{{ item.src }}"
    dest: "{{ [lookup('container', application_id, 'directories.instance'), item.dest] | path_join }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "shell/entrypoint.sh", dest: "entrypoint.sh", mode: "0755" }
    - { src: "php/login_search.php", dest: "login_search.php", mode: "0644" }
  notify:
    - compose-build
    - compose-up
  when: IS_STACK_HOST | bool

- name: "🎨 Render the in-house stylesheet and script of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "900_infinito.css.j2"
        dest: "{{ LAM_DESIGN_CSS_HOST }}"
        mode: "0644"
      - src: "900_infinito.js.j2"
        dest: "{{ LAM_DESIGN_JS_HOST }}"
        mode: "0644"
  when: LAM_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers
