---
- name: "👑 Converge OpenProject administrators on the administrator role group"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: true
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator]
    rbac_sync_service_key: "{{ OPENPROJECT_WEB_SERVICE }}"
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ OPENPROJECT_WEB_CONTAINER }}"
    rbac_sync_kind: container
    rbac_sync_user: ""
    rbac_sync_argv: [bash, -lc, "cd /app && bundle exec rails runner -"]
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/ruby/reconcile_admins.rb') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      OPENPROJECT_ADMIN_SPARED: "{{ OPENPROJECT_ADMIN_SPARED_LOGINS | to_json }}"
    rbac_sync_members_env:
      - { name: OPENPROJECT_ADMIN_MEMBERS, role: administrator, field: username }
