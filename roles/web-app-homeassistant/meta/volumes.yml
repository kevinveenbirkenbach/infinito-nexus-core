---
homeassistant_config:
  type: volume
  mounts:
    - service: homeassistant
      target: /config

homeassistant_configuration:
  type: config
  source: "{{ [ lookup('container', 'web-app-homeassistant', 'directories.config'), 'configuration.yaml' ] | path_join }}"
  mode: "0644"
  mounts:
    - service: homeassistant
      target: /config/configuration.yaml

homeassistant_ldap_login:
  type: config
  source: "{{ [ lookup('container', 'web-app-homeassistant', 'directories.config'), 'ldap_login.py' ] | path_join }}"
  mode: "0444"
  mounts:
    - service: homeassistant
      target: /usr/local/share/infinito/ldap_login.py
      when: "{{ lookup('config', 'web-app-homeassistant', 'services.ldap.enabled') | bool }}"
