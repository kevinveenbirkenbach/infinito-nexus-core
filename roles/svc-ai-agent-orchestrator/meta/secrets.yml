---
credentials:
  api_key:
    description: Bearer key a management-API caller (Open WebUI, n8n, Flowise) presents to the orchestrator
    algorithm: alphanumeric
    validation:
      min_length: 32
  webhook_secret:
    description: Shared secret the orchestrator verifies X-Hub-Signature-256 (and the provider equivalents) against before it re-fetches an event
    algorithm: alphanumeric
    validation:
      min_length: 32
  checkpoint_encryption_key:
    description: Symmetric key the LangGraph EncryptedSerializer encrypts graph checkpoints with before they reach svc-db-postgres
    algorithm: alphanumeric
    validation:
      min_length: 32
  litellm_api_key:
    description: The orchestrator's own virtual key for the shared svc-ai-litellm gateway, used for every model node it relays
    algorithm: sk_prefixed
    validation:
      min_length: 50
