---
- name: "📦 Install & activate {{ SHOPWARE_OIDC_PLUGIN }}"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      container exec -i --user {{ SHOPWARE_USER }}
      -e SHOPWARE_ROOT={{ SHOPWARE_ROOT | quote }}
      -e PLUGIN_NAME={{ SHOPWARE_OIDC_PLUGIN | quote }}
      {{ SHOPWARE_WEB_LOCAL_CID | quote }}
      sh
    stdin: |
      set -e
      cd "$SHOPWARE_ROOT"
      php bin/console plugin:refresh
      installed="$(php bin/console plugin:install --activate "$PLUGIN_NAME")"
      printf '%s\n' "$installed"
      printf '%s' "$installed" | grep -qi installed
  changed_when: false

- name: "🔐 Ensure the Keycloak login provider is configured"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      container exec -i --user {{ SHOPWARE_USER }}
      -e SHOPWARE_API_BASE={{ SHOPWARE_API_BASE | quote }}
      -e ADMIN_USER={{ lookup('users', 'platform_administrator').username | quote }}
      -e ADMIN_PASSWORD
      -e OIDC_AUTH_SERVER={{ OIDC.URL | quote }}
      -e OIDC_INTERNAL_BASE={{ SHOPWARE_OIDC_INTERNAL_BASE | quote }}
      -e OIDC_REALM={{ OIDC.CLIENT.REALM | quote }}
      -e OIDC_CLIENT_ID={{ OIDC.CLIENT.ID | quote }}
      -e OIDC_CLIENT_SECRET
      -e RBAC_GROUP_CLAIM={{ RBAC.GROUP.CLAIM | quote }}
      -e RBAC_GROUP_ADMIN={{ SHOPWARE_OIDC_ADMIN_GROUP | quote }}
      -e RBAC_GROUP_EDITOR={{ SHOPWARE_OIDC_EDITOR_GROUP | quote }}
      -e ACL_EDITOR_ROLE_NAME={{ SHOPWARE_ACL_EDITOR_ROLE_NAME | quote }}
      -e ACL_EDITOR_PRIVILEGES
      {{ SHOPWARE_WEB_LOCAL_CID | quote }}
      php
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/php/oidc/client.php') }}"
  environment:
    ADMIN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
    OIDC_CLIENT_SECRET: "{{ OIDC.CLIENT.SECRET }}"
    ACL_EDITOR_PRIVILEGES: "{{ SHOPWARE_ACL_EDITOR_PRIVILEGES | to_json }}"
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🛡️ Withdraw admin flag and Editor role from Keycloak users outside their group"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      container exec -i --user {{ SHOPWARE_USER }}
      -e KEEP_ADMINS
      -e KEEP_EDITORS
      -e ACL_EDITOR_ROLE_NAME={{ SHOPWARE_ACL_EDITOR_ROLE_NAME | quote }}
      {{ SHOPWARE_WEB_LOCAL_CID | quote }}
      php
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/php/oidc/admins.php') }}"
  environment:
    KEEP_ADMINS: >-
      {{
        ([lookup('users', 'platform_administrator').username, lookup('users', 'platform_administrator').email]
         + (shopware_rbac_administrators | map(attribute='username') | list)
         + (shopware_rbac_administrators | map(attribute='email') | select | list))
        | to_json
      }}
    KEEP_EDITORS: >-
      {{
        ([lookup('users', 'platform_administrator').username, lookup('users', 'platform_administrator').email]
         + (shopware_rbac_editors | map(attribute='username') | list)
         + (shopware_rbac_editors | map(attribute='email') | select | list))
        | to_json
      }}
  register: shopware_oidc_admin_demotion
  changed_when: shopware_oidc_admin_demotion.stdout is search('\[CHANGED\]')

- name: "♻️ Clear the cache so the provider is discovered"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      container exec -i --user {{ SHOPWARE_USER }}
      -e SHOPWARE_ROOT={{ SHOPWARE_ROOT | quote }}
      {{ SHOPWARE_WEB_LOCAL_CID | quote }}
      sh
    stdin: |
      set -e
      cd "$SHOPWARE_ROOT"
      php bin/console cache:clear
  changed_when: false
