---
- name: "🧩 Load docker, DB and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "👔 Shopware manager-side operations (file deploys + container exec)"
  include_tasks: 02_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "🛡️ Converge the admin flag and the Editor role on the role groups"
  include_tasks: 06_rbac.yml
