---
- name: "👥 Resolve the members of the {{ application_id }} administrator role"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/members.yml') }}"
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: administrator

- name: "👥 Keep the members of the {{ application_id }} administrator role"
  ansible.builtin.set_fact:
    gitlab_rbac_administrators: "{{ rbac_members }}"

- name: "👥 Resolve the members of the {{ application_id }} external role"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/members.yml') }}"
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: external

- name: "🛂 Reconcile GitLab administrators and external users with the role groups"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - GITLAB_RBAC_ADMINISTRATORS
      - -e
      - GITLAB_RBAC_EXTERNALS
      - -e
      - GITLAB_RBAC_KEEP_ADMINS
      - "{{ GITLAB_RAILS_LOCAL_CID }}" # nocheck: container-exec-resolver
      - "{{ GITLAB_RAILS_BIN }}"
      - runner
      - "-"
    stdin: "{{ lookup('file', 'ruby/reconcile_rbac.rb') }}"
  environment:
    GITLAB_RBAC_ADMINISTRATORS: "{{ gitlab_rbac_administrators | to_json }}"
    GITLAB_RBAC_EXTERNALS: "{{ rbac_members | to_json }}"
    GITLAB_RBAC_KEEP_ADMINS: "{{ [GITLAB_ROOT_USERNAME, GITLAB_ADMIN_USERNAME] | to_json }}"
  register: gitlab_rbac_reconcile
  changed_when: gitlab_rbac_reconcile.stdout is search('\[CHANGED\]')
  failed_when: >-
    gitlab_rbac_reconcile.rc != 0
    or gitlab_rbac_reconcile.stdout is search('\[FAIL\]')
  delegate_to: "{{ GITLAB_RAILS_HOST_NODE }}"
  run_once: true
