---
- name: "🛂 Converge GitLab administrators and external users on the role groups"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: true
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator, external]
    rbac_sync_service_key: "{{ GITLAB_WEBSERVICE_SERVICE_NAME }}"
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ GITLAB_WEBSERVICE_CONTAINER }}"
    rbac_sync_kind: container
    rbac_sync_user: ""
    rbac_sync_argv: ["{{ GITLAB_RAILS_BIN }}", runner, "-"]
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/ruby/reconcile_rbac.rb') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      GITLAB_RBAC_KEEP_ADMINS: "{{ [GITLAB_ROOT_USERNAME, GITLAB_ADMIN_USERNAME] | to_json }}"
    rbac_sync_members_env:
      - { name: GITLAB_RBAC_ADMINISTRATORS, role: administrator, field: "" }
      - { name: GITLAB_RBAC_EXTERNALS, role: external, field: "" }
