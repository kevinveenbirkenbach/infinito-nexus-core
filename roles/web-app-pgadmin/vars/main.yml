---
application_id: "web-app-pgadmin"
entity_name: "{{ application_id | entity_name }}"

PGADMIN_ADMIN_EMAIL: "{{ lookup('config', application_id, 'users.platform_administrator.email') }}"
PGADMIN_ADMIN_EMAIL_TLD: "{{ PGADMIN_ADMIN_EMAIL.split('@')[1].split('.')[-1] }}"
PGADMIN_ADMIN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"

PGADMIN_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"
PGADMIN_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"

PGADMIN_SERVER_MODE: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.server_mode') | bool  }}"
PGADMIN_MASTER_PASSWORD_REQUIRED: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.master_password_required') | bool  }}"

PGADMIN_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') | bool }}"
PGADMIN_OAUTH2_LOGIN_GROUPS:
  - "/{{ lookup('rbac_group_path', application_id=application_id, role='administrator') }}"
  - "/{{ lookup('rbac_group_path', application_id=application_id, role='user') }}"
PGADMIN_OAUTH2_CONFIG:
  - OAUTH2_NAME: "keycloak"
    OAUTH2_DISPLAY_NAME: "{{ OIDC.BUTTON_TEXT }}"
    OAUTH2_CLIENT_ID: "{{ OIDC.CLIENT.ID }}"
    OAUTH2_CLIENT_SECRET: "{{ OIDC.CLIENT.SECRET }}"
    OAUTH2_TOKEN_URL: "{{ OIDC.CLIENT.TOKEN_URL }}"
    OAUTH2_AUTHORIZATION_URL: "{{ OIDC.CLIENT.AUTHORIZE_URL }}"
    OAUTH2_SERVER_METADATA_URL: "{{ OIDC.CLIENT.DISCOVERY_DOCUMENT }}"
    OAUTH2_API_BASE_URL: "{{ OIDC.CLIENT.ISSUER_URL }}/"
    OAUTH2_USERINFO_ENDPOINT: "{{ OIDC.CLIENT.USER_INFO_URL }}"
    OAUTH2_SCOPE: "openid email profile"
    OAUTH2_ICON: "fa-key"
    OAUTH2_USERNAME_CLAIM: "{{ OIDC.ATTRIBUTES.USERNAME }}"
    OAUTH2_ADDITIONAL_CLAIMS: "{{ {RBAC.GROUP.CLAIM: PGADMIN_OAUTH2_LOGIN_GROUPS} }}"
    OAUTH2_LOGOUT_URL: "{{ OIDC.CLIENT.LOGOUT_URL }}?post_logout_redirect_uri={redirect_uri}&id_token_hint={id_token}"

PGADMIN_USER: 5050
PGADMIN_GROUP: "{{ PGADMIN_USER }}"
