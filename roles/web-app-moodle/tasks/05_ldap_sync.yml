---
# Configure Moodle's auth_ldap plugin. In variant 0 (hybrid) it runs
# in sync-only mode (login = auth_oidc); in variant 1 (LDAP-only) it
# is the primary login plugin. Field mapping is identical between
# variants.

- name: "▶️ Run Moodle DB upgrade for auth_ldap plugin"
  shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ MOODLE_CLI_DIR }}/upgrade.php --non-interactive
  failed_when: false
  changed_when: false

- name: "🔧 Configure auth_ldap connection + field mapping"
  loop:
    - { name: "host_url", value: "{{ LDAP.SERVER.URI }}" }
    - { name: "ldap_version", value: 3 }
    - { name: "start_tls", value: 0 }
    - { name: "user_type", value: "rfc2307" }
    - { name: "contexts", value: "{{ LDAP.DN.OU.USERS }}" }
    - { name: "search_sub", value: 1 }
    - { name: "user_attribute", value: "{{ LDAP.USER.ATTRIBUTES.ID }}" }
    - { name: "objectclass", value: "{{ LDAP.FILTERS.USERS.ALL }}" }
    - { name: "memberattribute", value: "{{ MOODLE_LDAP_GROUP_MEMBER_ATTRIBUTE }}" }
    - { name: "memberattribute_isdn", value: 1 }
    - { name: "bind_dn", value: "{{ LDAP.DN.ADMINISTRATOR.DATA }}" }
    - { name: "bind_pw", value: "{{ LDAP.BIND_CREDENTIAL }}" }
    - { name: "creators", value: "*" }
    - { name: "auth_user_create", value: "{{ MOODLE_OIDC_ENABLED | bool | ternary(0, 1) }}" }
    - { name: "removeuser", value: 1 } # 1 = suspend (preserve history); 2 = delete
    - { name: "sync_suspended", value: 1 }
    - { name: "field_map_firstname", value: "{{ LDAP.USER.ATTRIBUTES.FIRSTNAME }}" }
    - { name: "field_lock_firstname", value: "locked" }
    - { name: "field_updatelocal_firstname", value: "onlogin" }
    - { name: "field_map_lastname", value: "{{ LDAP.USER.ATTRIBUTES.SURNAME }}" }
    - { name: "field_lock_lastname", value: "locked" }
    - { name: "field_updatelocal_lastname", value: "onlogin" }
    - { name: "field_map_middlename", value: "{{ LDAP.USER.ATTRIBUTES.INITIALS }}" }
    - { name: "field_lock_middlename", value: "locked" }
    - { name: "field_updatelocal_middlename", value: "onlogin" }
    - { name: "field_map_alternatename", value: "{{ LDAP.USER.ATTRIBUTES.DISPLAY_NAME }}" }
    - { name: "field_lock_alternatename", value: "locked" }
    - { name: "field_updatelocal_alternatename", value: "onlogin" }
    - { name: "field_map_email", value: "{{ LDAP.USER.ATTRIBUTES.MAIL }}" }
    - { name: "field_lock_email", value: "locked" }
    - { name: "field_updatelocal_email", value: "onlogin" }
    - { name: "field_map_phone1", value: "{{ LDAP.USER.ATTRIBUTES.PHONE }}" }
    - { name: "field_lock_phone1", value: "locked" }
    - { name: "field_updatelocal_phone1", value: "onlogin" }
    - { name: "field_map_phone2", value: "{{ LDAP.USER.ATTRIBUTES.MOBILE }}" }
    - { name: "field_lock_phone2", value: "locked" }
    - { name: "field_updatelocal_phone2", value: "onlogin" }
    - { name: "field_map_address", value: "{{ LDAP.USER.ATTRIBUTES.STREET }}" }
    - { name: "field_lock_address", value: "locked" }
    - { name: "field_updatelocal_address", value: "onlogin" }
    - { name: "field_map_city", value: "{{ LDAP.USER.ATTRIBUTES.LOCALITY }}" }
    - { name: "field_lock_city", value: "locked" }
    - { name: "field_updatelocal_city", value: "onlogin" }
    - { name: "field_map_country", value: "{{ LDAP.USER.ATTRIBUTES.COUNTRY }}" }
    - { name: "field_lock_country", value: "locked" }
    - { name: "field_updatelocal_country", value: "onlogin" }
    - { name: "field_map_institution", value: "{{ LDAP.USER.ATTRIBUTES.ORGANIZATION }}" }
    - { name: "field_lock_institution", value: "locked" }
    - { name: "field_updatelocal_institution", value: "onlogin" }
    - { name: "field_map_department", value: "{{ LDAP.USER.ATTRIBUTES.DEPARTMENT }}" }
    - { name: "field_lock_department", value: "locked" }
    - { name: "field_updatelocal_department", value: "onlogin" }
    - { name: "field_map_description", value: "{{ LDAP.USER.ATTRIBUTES.DESCRIPTION }}" }
    - { name: "field_lock_description", value: "locked" }
    - { name: "field_updatelocal_description", value: "onlogin" }
    - { name: "field_map_idnumber", value: "{{ LDAP.USER.ATTRIBUTES.EMPLOYEE_NUMBER }}" }
    - { name: "field_lock_idnumber", value: "locked" }
    - { name: "field_updatelocal_idnumber", value: "onlogin" }
    - { name: "field_map_url", value: "{{ LDAP.USER.ATTRIBUTES.WEBSITE }}" }
    - { name: "field_lock_url", value: "locked" }
    - { name: "field_updatelocal_url", value: "onlogin" }
    - { name: "field_map_lang", value: "{{ LDAP.USER.ATTRIBUTES.LOCALE }}" }
    - { name: "field_lock_lang", value: "locked" }
    - { name: "field_updatelocal_lang", value: "onlogin" }
    - { name: "field_map_firstnamephonetic", value: "{{ LDAP.USER.ATTRIBUTES.PHONETIC_GIVEN }}" }
    - { name: "field_lock_firstnamephonetic", value: "locked" }
    - { name: "field_updatelocal_firstnamephonetic", value: "onlogin" }
    - { name: "field_map_lastnamephonetic", value: "{{ LDAP.USER.ATTRIBUTES.PHONETIC_FAMILY }}" }
    - { name: "field_lock_lastnamephonetic", value: "locked" }
    - { name: "field_updatelocal_lastnamephonetic", value: "onlogin" }
    - { name: "field_map_timezone", value: "{{ LDAP.USER.ATTRIBUTES.TIMEZONE }}" }
    - { name: "field_lock_timezone", value: "locked" }
    - { name: "field_updatelocal_timezone", value: "onlogin" }
  loop_control:
    label: "{{ item.name }}"
  shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ MOODLE_CLI_DIR }}/cfg.php --component=auth_ldap
    --name={{ item.name }} --set="{{ item.value }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: false

- name: "👥 Map the RBAC role groups onto Moodle's system roles"
  loop: "{{ MOODLE_LDAP_ROLE_GROUP_DNS | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ MOODLE_CLI_DIR }}/cfg.php --component=auth_ldap
    --name={{ (item.key ~ 'context') | quote }}
    --set={{ item.value | quote }}
  changed_when: false

- name: "🟢 Enable auth_ldap plugin"
  shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ MOODLE_CLI_DIR }}/cfg.php --name=auth --set=ldap
  when: not (MOODLE_OIDC_ENABLED | bool)
  changed_when: false

- name: "🟢 Variant 0: let auth_oidc own the login page, auth_ldap syncs"
  when: MOODLE_OIDC_ENABLED | bool
  block:
    - name: "🟢 Variant 0: enable both auth_oidc + auth_ldap (oidc primary)"
      shell: >
        container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
        php {{ MOODLE_CLI_DIR }}/cfg.php --name=auth --set=oidc,ldap
      changed_when: false

    - name: "🔑 Hide auth_ldap from login page in variant 0 (OIDC is the only entry point)"
      shell: >
        container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
        php {{ MOODLE_CLI_DIR }}/cfg.php --component=auth_ldap
        --name=removecontexts --set=1
      changed_when: false

- name: "⚡ Trigger auth_ldap sync to pre-provision LDAP users"
  shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ MOODLE_CLI_DIR }}/scheduled_task.php
    --execute='\auth_ldap\task\sync_task'
  failed_when: false
  changed_when: false
