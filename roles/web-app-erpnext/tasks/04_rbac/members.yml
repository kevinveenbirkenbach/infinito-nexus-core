---
# Param erpnext_rbac_role: declared RBAC role whose members are collected into erpnext_rbac_members.
- name: "👥 Resolve the members of '{{ erpnext_rbac_role }}'"
  ansible.builtin.include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: "{{ erpnext_rbac_role }}"

- name: "👥 Collect the members of '{{ erpnext_rbac_role }}'"
  ansible.builtin.set_fact:
    erpnext_rbac_members: "{{ erpnext_rbac_members | combine({erpnext_rbac_role: rbac_members}) }}"
