---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full

- name: "👥 Resolve the administrator members of {{ application_id }}"
  ansible.builtin.include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: administrator

- name: "📄 Render ejabberd configuration"
  stack_host_template:
    src: configuration.yml.j2
    dest: "{{ XMPP_CONFIG_FILE }}"
    mode: "0644"
  notify:
    - compose-up
