---
application_id: web-app-fusiondirectory
entity_name: "{{ application_id | entity_name }}"

FUSIONDIRECTORY_CONTAINER: "{{ lookup('config', application_id, 'services.fusiondirectory.name') }}"
FUSIONDIRECTORY_URL: "{{ lookup('tls', application_id, 'url.base') | regex_replace('/+$', '') }}"
FUSIONDIRECTORY_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') }}"
FUSIONDIRECTORY_THEME_CSS_HOST: "{{ [lookup('container', application_id, 'directories.volumes'), 'theme.css'] | path_join }}"
FUSIONDIRECTORY_DESIGN_TITLE: "{{ lookup('design', application_id).title if (FUSIONDIRECTORY_DESIGN_ENABLED | bool and lookup('design', application_id).title is string)
  else '' }}"
FUSIONDIRECTORY_HEADERS_TPL_HOST: "{{ [lookup('container', application_id, 'directories.volumes'), 'headers.tpl'] | path_join }}"
FUSIONDIRECTORY_ADMINISTRATOR_GROUP_DN: "cn={{ application_id }}-administrator,{{ LDAP.DN.OU.ROLES }}"
FUSIONDIRECTORY_USER_MANAGER_GROUP_DN: "cn={{ application_id }}-user-manager,{{ LDAP.DN.OU.ROLES }}"
FUSIONDIRECTORY_SELF_SERVICE_GROUP_DN: "cn={{ application_id }}-self-service,{{ LDAP.DN.OU.ROLES }}"
FUSIONDIRECTORY_LOGIN_METHOD: "{{ 'LoginHTTPHeader' if lookup('sso', application_id, 'is_proxy_gated') | bool else 'LoginPost' }}"
FUSIONDIRECTORY_HTTP_HEADER_NAME: "X_FORWARDED_PREFERRED_USERNAME"
FUSIONDIRECTORY_SSO_PROXY_HEADER: "X-Infinito-Sso-Proxy"
FUSIONDIRECTORY_SSO_PROXY_SECRET: "{{ lookup('config', application_id, 'secrets.credentials.sso_proxy_secret') }}"
FUSIONDIRECTORY_SSO_PROXY_CONF_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'sso-proxy.conf'] | path_join }}"
