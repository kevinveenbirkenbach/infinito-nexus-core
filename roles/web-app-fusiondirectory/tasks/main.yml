---
# The guard renders before the compose file, which names the swarm secret after the content hash it reads at render time.
- name: "🔐 Render the proxy-secret guard of the identity header for {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "sso_proxy.conf.j2"
        dest: "{{ FUSIONDIRECTORY_SSO_PROXY_CONF_HOST }}"
        mode: "0400"
        notify: []

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    webserver_location_extra_configuration: 'proxy_set_header {{ FUSIONDIRECTORY_SSO_PROXY_HEADER }} "{{ FUSIONDIRECTORY_SSO_PROXY_SECRET }}";'

- name: "🎨 Render the in-house theme.css and headers.tpl of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "theme.css.j2"
        dest: "{{ FUSIONDIRECTORY_THEME_CSS_HOST }}"
        mode: "0644"
      - src: "headers.tpl.j2"
        dest: "{{ FUSIONDIRECTORY_HEADERS_TPL_HOST }}"
        mode: "0644"
        condition: "{{ FUSIONDIRECTORY_DESIGN_TITLE | length > 0 }}"
  when: FUSIONDIRECTORY_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "📇 Bootstrap the FusionDirectory tree in LDAP for {{ application_id }}"
  ansible.builtin.include_tasks: 01_ldap.yml
  when: IS_STACK_HOST | bool
