---
- name: "📁 Ensure the fixture build dir exists for '{{ application_id }}'"
  ansible.builtin.file:
    path: "{{ FIXTURE_APP_DEST_DIR }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true

- name: "🌱 Stage the fixture web root and seeded findings"
  stack_host_copy:
    src: "{{ FIXTURE_APP_SRC_DIR }}/"
    dest: "{{ FIXTURE_APP_DEST_DIR }}/"
    mode: "0644"
    directory_mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "🚿 flush compose for '{{ application_id }}'"
  meta: flush_handlers
