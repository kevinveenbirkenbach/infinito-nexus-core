limit_req_zone $binary_remote_addr zone=fixture_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Set-Cookie "fixture_session=seeded-before-consent; Path=/; Max-Age=86400; SameSite=Lax" always;
    add_header X-Frame-Options "SAMEORIGIN" always;  # nocheck: deprecated-http-header - seeded fixture header

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /login {
        limit_req zone=fixture_login burst=3 nodelay;
        try_files /login.html =404;
    }
}
