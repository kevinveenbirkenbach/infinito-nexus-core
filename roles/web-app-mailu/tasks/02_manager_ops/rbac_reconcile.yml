---
- name: "👑 Converge Mailu global admins and domain managers on the role groups"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: true
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator, domain-manager]
    rbac_sync_service_key: admin
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ lookup('config', application_id, 'services.admin.name') }}"
    rbac_sync_kind: host
    rbac_sync_user: ""
    rbac_sync_argv: []
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/python/rbac_sync.py') }}"
    rbac_sync_modules:
      - { name: mailu_rbac.py, content: "{{ lookup('file', role_path ~ '/files/python/mailu_rbac.py') }}" }
    rbac_sync_env:
      MAILU_API_BEARER: "{{ MAILU_API_TOKEN }}"
      MAILU_API_BASE_URL: "{{ MAILU_API_SERVICE_BASE_URL }}"
      MAILU_DOMAIN: "{{ MAILU_DOMAIN }}"
      MAILU_CURL_READ: "{{ 30 | curl }}"
      MAILU_CURL_WRITE: "{{ 30 | curl(retries=0) }}"
      MAILU_RBAC_KEEP: "{{ [lookup('users', 'platform_administrator').username] | to_json }}"
    rbac_sync_members_env:
      - { name: RBAC_ADMINISTRATORS, role: administrator, field: username }
      - { name: RBAC_DOMAIN_MANAGERS, role: domain-manager, field: username }
