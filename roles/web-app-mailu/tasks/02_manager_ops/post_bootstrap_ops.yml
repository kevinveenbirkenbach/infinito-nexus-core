---
- name: ⏳ Wait for Mailu Redis
  include_tasks: ../04_wait_for_redis.yml

- name: "👥 Resolve the administrator members of {{ application_id }}"
  include_tasks: utils/rbac/members.yml
  vars:
    rbac_members_application_id: "{{ application_id }}"
    rbac_members_role: administrator

- name: "👥 Keep the administrator members of {{ application_id }}"
  ansible.builtin.set_fact:
    mailu_rbac_administrators: "{{ rbac_members }}"

- name: "📁 Create Mailu accounts"
  include_tasks: ../05_manage_user.yml
  vars:
    mailu_action: "{{ ((user_item.value.username | lower) in MAILU_RBAC_ADMIN_USERNAMES) | ternary('admin', 'user') }}"
    mailu_user_key: "{{ user_item.key }}"
    mailu_user_name: "{{ user_item.value.username }}"
    mailu_user_password: "{{ user_item.value.password }}"
    mailu_token_name: "{{ SOFTWARE_NAME ~ ' Token for ' ~ user_item.value.username }}"
    mailu_user_roles: "{{ user_item.value.roles | default([]) }}"
    mailu_user_accounts: "{{ user_item.value.accounts | default([]) }}"
  loop: "{{ MAILU_USERS | dict2items }}"
  loop_control:
    loop_var: user_item
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "👑 Reconcile Mailu global administrators and domain managers"
  include_tasks: rbac_reconcile.yml

- name: "📁 Create Mailu forward aliases"
  include_tasks: ../utils/manage/alias.yml
  vars:
    mailu_alias_localpart: "{{ user_item.value.username }}"
    mailu_alias_destination: "{{ lookup('users', user_item.value.forward).email }}"
  loop: "{{ lookup('users') | dict2items }}"
  loop_control:
    loop_var: user_item
  when: (user_item.value.forward | default('')) | length > 0
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "📂 Include Cert deploy service for '{{ role_name }}'"
  include_role:
    name: sys-ctl-mtn-cert-deploy
  when: (lookup('tls', application_id, 'enabled') | bool) or (MAILU_ACTIVE_PROVIDER | bool)

- name: ⏳ Wait for Mailu antispam
  include_tasks: ../06_wait_for_antispam.yml

- name: ⚙️ Generate DKIM public key
  include_tasks: ../07_generate-and-read-dkim.yml

- name: 🔧 Set Mailu DNS records
  include_tasks: ../08_dns-records.yml

- name: "🔐 Apply Mailu OIDC provider config"
  include_tasks: ../09_oidc_apply.yml
  when: MAILU_OIDC_ENABLED | bool
