---
- name: "🛂 Mattermost | Converge system_admin on the administrator role group"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: true
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator]
    rbac_sync_service_key: "{{ entity_name }}"
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ MATTERMOST_CONTAINER }}"
    rbac_sync_kind: host
    rbac_sync_user: ""
    rbac_sync_argv: []
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/python/rbac_sync.py') }}"
    rbac_sync_modules:
      - { name: mattermost_rbac.py, content: "{{ lookup('file', role_path ~ '/files/python/mattermost_rbac.py') }}" }
    rbac_sync_env:
      MATTERMOST_MMCTL: "{{ MATTERMOST_MMCTL }}"
      MATTERMOST_RBAC_KEEP: "{{ [lookup('users', 'platform_administrator').username] | to_json }}"
    rbac_sync_members_env:
      - { name: RBAC_ADMINISTRATORS, role: administrator, field: "" }
