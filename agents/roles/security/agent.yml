---
runtime: claude-code
lifecycle: on_demand
owner: operator
repositories:
  - infinito-nexus/core
firewall_roles:
  - security
skills:
  - i8-refactor
models:
  local:
    - ollama
  external:
    - anthropic
  default: anthropic
keepass:
  mode: broker
write_enabled: false
triggers:
  - new_dependency
  - pull_request_opened
  - cve_feed
quotas:
  requests_per_minute: 60
  budget_usd_per_day: 10
  tool_calls_per_minute: 120
  pull_requests_per_hour: 5
  comments_per_hour: 20
  emails_per_hour: 10
credentials: {}
